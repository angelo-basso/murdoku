server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/manifest+json;

    # Assets non versionnés (icônes, avatars, logo) : cache court, revalidé.
    # `^~` passe avant la regex ci-dessous pour éviter un cache "immutable" 1 an.
    location ^~ /assets/ {
        expires    1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files  $uri =404;
    }

    # Bundles versionnés (hash dans le nom) : cache long et immuable
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Application SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
