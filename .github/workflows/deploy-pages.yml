name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions requises par le déploiement GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on annule les runs en cours devenus obsolètes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base-href = /<nom-du-repo>/ pour que l'app fonctionne sous le sous-chemin Pages
      - name: Build (base href adapté à Pages)
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/

      # Ionic/Angular utilise le routage HTML5 : on duplique index.html en 404.html
      # pour que les liens profonds ne renvoient pas d'erreur 404 sur Pages
      - name: SPA fallback (404.html)
        run: cp www/index.html www/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
