name: Build Android APK

# APK de test (non signé pour la diffusion), lancé à la main. Les versions officielles : release.yml.
on:
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Évite le paquet obsolète « tools » (défaut de l'action, désormais introuvable).
          # Capacitor 6 cible le SDK 34.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native icons & splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huis-clos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
