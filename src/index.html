<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Murdoku — Sudoku d'enquête</title>
    <base href="/" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#17102b" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Murdoku" />

    <style>
      /* Splash affiché avant le bootstrap d'Angular, masqué dès que l'app rend */
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(120% 90% at 50% 35%, #2a1d4d 0%, #17102b 55%, #0d0a1c 100%);
      }
      #pre-splash img {
        width: min(58vw, 240px);
        animation: psPulse 1.8s ease-in-out infinite;
      }
      #pre-splash .ps-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d4af37;
        box-shadow: 16px 0 #d4af3766, -16px 0 #d4af3766;
        animation: psBlink 1s steps(3) infinite;
      }
      @keyframes psPulse {
        0%, 100% { opacity: 0.85; transform: scale(0.99); }
        50% { opacity: 1; transform: scale(1.01); }
      }
      @keyframes psBlink {
        0%, 100% { box-shadow: 16px 0 #d4af3722, -16px 0 #d4af37; }
        50% { box-shadow: 16px 0 #d4af37, -16px 0 #d4af3722; }
      }
      app-root:not(:empty) + #pre-splash { display: none; }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <div id="pre-splash">
      <img src="assets/brand/logo.svg" alt="Murdoku" />
      <div class="ps-dot"></div>
    </div>
  </body>
</html>
